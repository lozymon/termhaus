[package]
name = "termhaus"
version = "0.12.0"
description = "A control room of live terminals — a GUI terminal multiplexer for driving fleets of CLI agents"
authors = ["Termhaus"]
edition = "2021"
# One binary, three faces: the GUI app, the `termhaus <cmd>` control CLI, and the `termhaus mcp`
# server are all the same executable, dispatched on the first arg in main.rs (ADR-0007).
default-run = "termhaus"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termhaus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2"

# Windows-only: the inter-pane control bus (M7.5) uses named pipes via raw Win32 FFI in
# `control_transport.rs`. Target-gated, so the Linux build pulls nothing new and stays
# byte-identical. Used by the `termhaus`/`termhaus mcp` subcommands (now lib modules).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

